name: Guard against committed secrets

# Purpose: fail the build if a secret-looking file or value is committed.
#
# Why this exists: a Stripe webhook secret was committed to this repo's
# history in October 2026 and the repo is PUBLIC. .gitignore already blocks
# .env* on every branch, but .gitignore does NOT stop a force-add
# (`git add -f`), a secrets manager writing a file, or an editor adding an
# untracked path. This check is the second line of defense.
#
# It detects - it does not prevent. A hit means the secret must be
# ROTATED, not just deleted.

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for committed env files
        run: |
          echo "== committed env files =="
          FILES=$(git ls-files | grep -E '(^|/)\.env' | grep -v '\.env\.example$' || true)
          if [ -n "$FILES" ]; then
            echo "::error::Environment files are tracked in git:"
            echo "$FILES"
            echo "Rotate any secret in them, then run: git rm --cached <file>"
            exit 1
          fi
          echo "none found"

      - name: Scan tracked files for secret patterns
        run: |
          echo "== secret patterns in tracked files =="
          HITS=$(git grep -nIE \
            '(whsec_[A-Za-z0-9]{16,})|(sk_live_[A-Za-z0-9]{16,})|(rk_live_[A-Za-z0-9]{16,})|(AKIA[0-9A-Z]{16})|(ghp_[A-Za-z0-9]{30,})|(github_pat_[A-Za-z0-9_]{50,})|(eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,})|(SUPABASE_SERVICE_ROLE_KEY[=[:space:]]+[A-Za-z0-9._-]{100,})|(NEXTAUTH_SECRET[=[:space:]]+.{20,})|(MINIMAX_API_KEY[=[:space:]]+[A-Za-z0-9]{16,})|(PASSWORD[=[:space:]]+.{8,})' \
            -- . ':!*.lock' ':!package-lock.json' ':!pnpm-lock.yaml' || true)
          if [ -n "$HITS" ]; then
            echo "::error::Potential secret committed. ROTATE it, then purge the commit:"
            echo "$HITS"
            exit 1
          fi
          echo "none found"

      - name: Guard the CI node version
        run: |
          # Node2Shell (CVE-2026-111497, Brotli OOB write) is fixed in
          # 22.23.4 / 24.22.1 / 26.12.1. An unpinned `node-version: 22`
          # can float onto a vulnerable build, so require the pin.
          echo "== node version pin =="
          BAD=$(grep -rE "node-version:\s*['\"]?2[0-9](\.[0-9]+)*['\"]?\s*$" .github/workflows/ || true)
          if [ -n "$BAD" ]; then
            echo "::error::node-version is not pinned to a patched release:"
            echo "$BAD"
            echo "Use 22.23.4 or newer."
            exit 1
          fi
          echo "pin ok"
